<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1118" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3ddc84" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" stroke="#1f2d3d" stroke-width="3" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="14 6" filter="url(#glow)" />

  <!-- Avatar Human Silhouette with Security / Auditor Shield -->
  <!-- Head -->
  <circle cx="100" cy="68" r="27" fill="#162534" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <!-- Eye Scan Visor -->
  <path d="M82 66 Q100 58 118 66 Q100 74 82 66 Z" fill="#00d2ff" filter="url(#glow)" opacity="0.95" />
  
  <!-- Torso with Uniform Badge -->
  <path d="M52 144 C52 110, 72 104, 100 104 C128 104, 148 110, 148 144 L148 170 C148 176, 142 182, 136 182 L64 182 C58 182, 52 176, 52 170 Z" fill="#111d2a" stroke="#263b50" stroke-width="2" />
  
  <!-- Tie / Collar detail -->
  <path d="M92 104 L100 124 L108 104 Z" fill="url(#cyanGrad)" />

  <!-- Auditor Badge Icon overlay (Price tag + barcode) -->
  <g transform="translate(120, 114)">
    <circle cx="24" cy="24" r="22" fill="#0d1722" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Price tag icon -->
    <path d="M15 16 L27 16 L33 22 L21 34 L15 28 Z" fill="none" stroke="#ffd166" stroke-width="2" />
    <circle cx="21" cy="20" r="2" fill="#ffd166" />
    <!-- Scanner beam -->
    <line x1="12" y1="24" x2="36" y2="24" stroke="#3ddc84" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <!-- Number tag #AUD-007 -->
  <rect x="64" y="155" width="72" height="20" rx="10" fill="#081018" stroke="url(#cyanGrad)" stroke-width="1.5" />
  <text x="100" y="169" text-anchor="middle" fill="#3ddc84" font-family="'Rajdhani', sans-serif, Arial" font-size="11" font-weight="bold" letter-spacing="1">AUD-007</text>
</svg>